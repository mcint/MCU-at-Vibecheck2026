<style>
:root{--ink:#1b1b1b;--dim:#888;--acc:#0a6cff;--good:#17a673;--warn:#c8860a;--bad:#e0444f;--line:#e6e6e6;--bg:#fff;--card:#f7f7f8;--hi:#fff2b8}
@media(prefers-color-scheme:dark){:root{--ink:#eaeaea;--dim:#9aa;--acc:#6ab0ff;--good:#3cc38a;--warn:#e0a53a;--bad:#ef6a73;--line:#2c2c2c;--bg:#131313;--card:#1b1b1b;--hi:#3a3410}}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.55rem 1.1rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
.scn{display:flex;gap:.3rem;align-items:center;flex-wrap:wrap}
.scn b{font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-right:.2rem}
.scn button{font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:.18rem .6rem;cursor:pointer}
.scn button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.scn button small{display:block;font-size:.62rem;opacity:.75;font-weight:400}
.dots{display:flex;gap:.3rem}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer}
.dots i.on{background:var(--acc)}.dots i.done{background:color-mix(in srgb,var(--acc) 45%,var(--line))}
.badge{font-size:.78rem;padding:.12rem .6rem;border-radius:999px;background:var(--acc);color:#fff;white-space:nowrap}
.badge.loose{background:var(--bad)}
.why{padding:.3rem 1.1rem;color:var(--dim);font-size:.85rem;border-bottom:1px solid var(--line)}
.why b{color:var(--ink)}
.main{flex:1;display:grid;grid-template-columns:1.55fr .95fr;gap:.8rem;padding:.7rem 1.1rem}
@media(max-width:820px){.main{grid-template-columns:1fr}}
.stagewrap{display:flex;flex-direction:column;align-items:center;text-align:center}
.svgbar{width:100%;display:flex;justify-content:space-between;align-items:center}
.svgbar button{font:inherit;font-size:.72rem;border:1px solid var(--line);background:var(--card);color:var(--dim);border-radius:7px;padding:.1rem .5rem;cursor:pointer}
svg{width:min(560px,90vw);height:auto}
.t{font-size:1.4rem;font-weight:650;margin:.3rem 0 0}
.move{color:var(--dim);font-size:1rem;max-width:36rem}
.lean{font-family:ui-monospace,Menlo,monospace;font-size:.88rem;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.35rem .7rem;margin:.45rem 0 .1rem;white-space:pre-wrap;max-width:40rem}
.out{color:var(--acc);font-size:.95rem}.out::before{content:"→ ";color:var(--dim)}
.side{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:.5rem .7rem;display:flex;flex-direction:column}
.side h3{margin:.1rem 0 .4rem;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
.log{list-style:none;margin:0;padding:0;font-size:.82rem;overflow:auto;flex:1}
.log li{padding:.22rem 0;border-bottom:1px dashed var(--line)}.log li .n{color:var(--dim);font-variant-numeric:tabular-nums;margin-right:.35rem}
.log li.cur{color:var(--ink);font-weight:600}.log li.future{opacity:.4}.log li b{color:var(--ink)}.log li .o{color:var(--acc)}
.scale{margin-top:.5rem;padding-top:.4rem;border-top:1px solid var(--line);font-size:.75rem;color:var(--dim)}.scale b{color:var(--bad)}.scale a{color:var(--acc)}
.models{padding:0 1.1rem .2rem}
table.m{border-collapse:collapse;width:100%;font-size:.84rem;table-layout:fixed}
table.m th,table.m td{border:1px solid var(--line);padding:.35rem .55rem;vertical-align:top;text-align:left}
table.m th{background:var(--card);width:33.33%}
table.m th .tag{display:block;font-weight:400;color:var(--dim);font-size:.75rem}
table.m th .cit{display:block;font-weight:400;color:var(--dim);font-size:.68rem;margin-top:.15rem}.cit a{color:var(--acc);text-decoration:none}
table.m th.s1{border-top:3px solid var(--warn)}table.m th.s2{border-top:3px solid var(--good)}table.m th.s3{border-top:3px solid var(--acc)}
details.ref,details.more{border-top:1px solid var(--line)}
details.ref>summary,details.more>summary{cursor:pointer;color:var(--dim);font-size:.82rem;padding:.5rem 1.1rem}
.ref .rg{padding:0 1.1rem 1rem}.ref table{border-collapse:collapse;width:100%;font-size:.8rem}
.ref td,.ref th{border:1px solid var(--line);padding:.25rem .5rem;text-align:left;vertical-align:top}.ref th{background:var(--card)}.ref a{color:var(--acc);text-decoration:none}
.more .mg{padding:0 1.1rem 1rem;font-size:.86rem;color:var(--dim)}.more .mg b{color:var(--ink)}.more pre{background:var(--card);padding:.5rem;border-radius:6px;overflow:auto}
.nav{display:flex;align-items:center;justify-content:center;gap:1.4rem;padding:.5rem 1rem .9rem}
.nav button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:.4rem 1.1rem;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}.nav .pos{color:var(--dim);font-size:.85rem;min-width:4.5rem;text-align:center}

<script>
const ALL=JSON.parse(document.getElementById('data').textContent);
let sk=ALL.order[0], i=0, showAll=false;
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const D=()=>ALL.scenarios[sk];
function scnBar(){
 document.getElementById('scn').innerHTML='<b>scenario</b>'+ALL.order.map(k=>{const m=ALL.scenarios[k].meta;
  return `<button class="${k===sk?'on':''}" data-k="${k}">${esc(m.label)}<small>${esc(m.domain)}</small></button>`}).join('');
 document.querySelectorAll('#scn button').forEach(b=>b.onclick=()=>{sk=b.dataset.k;i=0;scnBar();render()});
}
function drawCS(nodes,f){
 const POS={};nodes.forEach(n=>POS[n.id]=[n.x,n.y]);
 const fn=new Set((f&&f.nodes)||[]),fe=new Set((f&&f.edges)||[]);let s='';
 for(const e of D().control_structure.edges){const a=POS[e.from],b=POS[e.to];if(!a||!b)continue;
  const key=e.from+'->'+e.to,hot=fe.has(key);const dash=e.missing?'6 4':e.weak?'2 3':'0';
  const col=e.missing?'var(--bad)':hot?'var(--acc)':'var(--line)';const dim=!hot&&!showAll;
  s+=`<line x1=${a[0]} y1=${a[1]} x2=${b[0]} y2=${b[1]} stroke="${col}" stroke-width="${hot?2.6:1.2}" stroke-dasharray="${dash}" opacity="${dim?0.45:1}"/>`;
  if(hot||showAll){const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;s+=`<text x=${mx+5} y=${my-3} font-size=8.5 fill="${e.missing?'var(--bad)':'var(--dim)'}">${esc(e.label)}</text>`;}}
 for(const n of nodes){const hot=fn.has(n.id);
  s+=`<rect x=${n.x-60} y=${n.y-15} width=120 height=30 rx=8 fill="${hot?'var(--hi)':'var(--card)'}" stroke="${hot?'var(--acc)':'var(--line)'}" stroke-width="${hot?2:1}" opacity="${hot||showAll?1:0.7}"/>`;
  s+=`<text x=${n.x} y=${n.y+4} text-anchor=middle font-size=10.5 fill="var(--ink)" opacity="${hot||showAll?1:0.75}">${esc(n.label)}</text>`;}
 document.getElementById('cs').innerHTML=s;
}
function renderRef(){const d=D(),SM=d.safety_models;
 const ms=['S1','S2','S3'].map(k=>{const m=SM[k];return `<tr><td><b>${m.label}</b> — ${esc(m.tag)}</td><td>${esc(m.author)}</td><td>${esc(m.year)}</td><td>${esc(m.cite)} · <a href="${esc(m.url)}" target="_blank">ref ↗</a></td></tr>`}).join('');
 const ts=(d.techniques||[]).map(t=>`<tr><td><b>${esc(t.name)}</b> — ${esc(t.full)}</td><td>${esc(t.author)}</td><td>${esc(t.year)}</td><td>${esc(t.examples)}${t.url?` · <a href="${esc(t.url)}" target="_blank">ref ↗</a>`:''}</td></tr>`).join('');
 document.getElementById('rg').innerHTML=`<p style="font-size:.8rem;color:var(--dim)">Dates are first use / naming; links are best available references (Wikipedia is partial for Safety-II/III — see the authors' papers).</p>`+
  `<table><tr><th>safety model</th><th>author</th><th>year</th><th>citation / where used</th></tr>${ms}</table>`+
  `<p style="margin-top:.6rem;font-size:.75rem;color:var(--dim)">other techniques</p><table><tr><th>technique</th><th>author</th><th>year</th><th>well-known use</th></tr>${ts}</table>`;
}
function render(){
 const d=D(),S=d.steps,SM=d.safety_models,st=S[i],sh=st.short||{};
 document.getElementById('why').innerHTML=`<b>${esc(d.meta.label)}</b> — ${esc(d.meta.why)} <span style="opacity:.7">${esc(d.oneliner||'')}</span>`;
 document.getElementById('dots').innerHTML=S.map((_,k)=>`<i class="${k===i?'on':k<i?'done':''}" data-k=${k}></i>`).join('');
 document.querySelectorAll('.dots i').forEach(x=>x.onclick=()=>{i=+x.dataset.k;render()});
 const loose=st.driver==='loosening';const bd=document.getElementById('badge');bd.textContent=loose?'SAFE LOOSENING':st.driver;bd.className='badge'+(loose?' loose':'');
 document.getElementById('t').textContent=sh.t||st.stage;document.getElementById('move').textContent=sh.move||'';
 document.getElementById('lean').textContent=sh.lean||'';document.getElementById('out').textContent=sh.out||'';
 document.getElementById('hint').textContent=st.stage;document.getElementById('pos').textContent=`${i+1} / ${S.length}`;
 document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===S.length-1;
 document.getElementById('log').innerHTML=S.map((x,k)=>{const cls=k===i?'cur':k>i?'future':'';const sx=x.short||{};
  return `<li class="${cls}"><span class="n">${x.id}.</span><b>${esc(sx.t||x.stage)}</b>${k<=i?` — <span class="o">${esc(sx.out||'')}</span>`:''}</li>`}).join('');
 const cur=document.querySelector('.log li.cur');if(cur)cur.scrollIntoView({block:'nearest'});
 if(d.scale){const sc=d.scale;document.getElementById('scale').innerHTML=`<b>scale:</b> you traced ${esc(sc.this)}. ${esc(sc.real)}. ${esc(sc.note)}. <a href="${esc(sc.viz)}" target="_blank">see the explosion ↗</a>`;}
 const r=st.rules||{};
 document.getElementById('mtab').innerHTML=
  '<tr>'+['S1','S2','S3'].map(k=>{const m=SM[k];return `<th class="${k.toLowerCase()}">${m.label}<span class="tag">${esc(m.tag)}</span><span class="cit"><a href="${esc(m.url)}" target="_blank">${esc(m.author)}, ${esc(m.year)} ↗</a></span></th>`}).join('')+'</tr>'+
  '<tr>'+['S1','S2','S3'].map(k=>`<td>${esc(r[k]||'')}</td>`).join('')+'</tr>';
 drawCS(d.control_structure.nodes,st.focus);
 document.getElementById('mg').innerHTML=
  `<p><b>state:</b> ${esc(st.state)}</p><p><b>options:</b> ${(st.next_actions||[]).map(o=>o===st.chosen?('<b>'+esc(o)+' ✓</b>'):esc(o)).join(' · ')}</p>`+
  `<p><b>obligation:</b> ${esc(st.lean_mapping&&st.lean_mapping.obligation||'')}</p><pre>${esc(st.lean_mapping&&st.lean_mapping.lean||'')}</pre><p><b>outcome:</b> ${esc(st.outcome)}</p>`;
 renderRef();
}
document.getElementById('prev').onclick=()=>{if(i>0){i--;render()}};
document.getElementById('next').onclick=()=>{const S=D().steps;if(i<S.length-1){i++;render()}};
document.getElementById('fold').onclick=()=>{showAll=!showAll;document.getElementById('fold').textContent=showAll?'labels: all ▸ focused':'labels: focused ▸ all';drawCS(D().control_structure.nodes,D().steps[i].focus)};
addEventListener('keydown',e=>{const S=D().steps;if(e.key==='ArrowLeft'&&i>0){i--;render()}if(e.key==='ArrowRight'&&i<S.length-1){i++;render()}});
scnBar();render();
</script></body></html>
